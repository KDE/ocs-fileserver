[general]
format = "xml"
perpage = 20
perpageMax = 10000

filesDir = "/var/www/ocs-fileserver/data/files"
zsyncDir = "/var/www/ocs-fileserver/data/zsync"
thumbnailsDir = "/var/www/ocs-fileserver/data/thumbnails"

redirectTargetServer = "http://localhost"

jwt_secret = ""

[security]
accessControlAllowOrigin = "*"
accessControlAllowCredentials = "true"
accessControlAllowMethods = "GET, HEAD, POST, PUT, DELETE, OPTIONS"
accessControlAllowHeaders = "Accept, Content-Type, Origin, Authorization, X-HTTP-Method-Override, X-Requested-With, X-Csrftoken"
accessControlMaxAge = 14 ; days

[log]
file = "../../data/logs/api_error.log"
mail = ""

[redis]
enabled = false
host = ""
port = 6379
ttl = 1800
namespace = ""

[download]
; Download link verification / rate limiting. All durations in seconds.
; If a key is omitted, the built-in default (shown here) applies.
max_link_age = 172800        ; 48h  – hard cap on token age (recency proof; kills old shared links)
activation_window = 900      ; 15m  – "click clock": starts on the FIRST click, not at render time
max_serves_per_token = 3     ;       – serves allowed per token within the window (resume/retry/mirror)
ip_safety_limit = 60         ;       – coarse per-IP requests per minute (NAT-tolerant scraping net)

[xsendfile]
enabled = false
headerName = "X-Accel-Redirect"
pathPrefix = ""

[gdpr]
; Placeholder value written into owner_id columns (NOT NULL) when a user is deleted.
; Must not be a valid user ID in the main application (use '0' or a dedicated sentinel).
deleted_owner_id = "0"

[awss3]
enabled = false
pathPrefix = ""
key = ""
secret = ""
bucket = ""
region = ""
signedUrlExpires = "+30 min"

[gdpr]
; Placeholder value written into owner_id columns (NOT NULL) when a user is deleted.
; Must not be a valid user ID in the main application (use '0' or a dedicated sentinel).
deleted_owner_id = "0"
